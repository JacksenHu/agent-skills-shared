<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <title>技能管理总览</title>
  <desc>交互控制台技能管理：分类列出、仓库安装、移除、按分类浏览、扫描各 Agent 已安装技能</desc>
  <rect x="0" y="0" width="1240" height="780" fill="#F8FAFC"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="620" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">技能管理（交互控制台 setup-wizard.ps1）</text>
  <text x="620" y="62" text-anchor="middle" font-size="13" fill="#64748B">所有操作都在共享技能库进行 · 主菜单 [3] 技能管理 + [5] 扫描各 Agent 已安装技能</text>

  <!-- 上排四张功能卡片 -->
  <!-- a 列出 -->
  <rect x="60" y="90" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">[3]a 列出技能（按分类分组）</text>
  <text x="200" y="148" text-anchor="middle" font-size="11" fill="#475569">9 大分类自动归类</text>
  <text x="200" y="168" text-anchor="middle" font-size="11" fill="#475569">每行：技能名 + SKILL.md 数 + 中文简介</text>
  <text x="200" y="188" text-anchor="middle" font-size="11" fill="#047857">简介来源：_meta.json（翻译）或 SKILL.md</text>
  <text x="200" y="208" text-anchor="middle" font-size="11" fill="#64748B">未命中的归「未分类」排最后</text>

  <!-- b 安装 -->
  <rect x="370" y="90" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="510" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">[3]b 从仓库链接安装</text>
  <text x="510" y="148" text-anchor="middle" font-size="11" fill="#475569">install-skill.ps1 -RepoUrl …</text>
  <text x="510" y="168" text-anchor="middle" font-size="11" fill="#475569">GitHub 仓库 / skills.sh 市场</text>
  <text x="510" y="188" text-anchor="middle" font-size="11" fill="#475569">zip 下载无需 git · 自动识别技能结构</text>
  <text x="510" y="208" text-anchor="middle" font-size="11" fill="#047857">自动生成中文简介 _meta.json</text>

  <!-- c 移除 -->
  <rect x="680" y="90" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="820" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">[3]c 移除技能</text>
  <text x="820" y="148" text-anchor="middle" font-size="11" fill="#7F1D1D">⚠ 影响所有已接入的 Agent</text>
  <text x="820" y="168" text-anchor="middle" font-size="11" fill="#475569">双重确认：确认 + 再次输入技能名</text>
  <text x="820" y="188" text-anchor="middle" font-size="11" fill="#475569">防误删：中途任何一步取消即中止</text>
  <text x="820" y="208" text-anchor="middle" font-size="11" fill="#64748B">共享库内真实目录，删除安全</text>

  <!-- d 按分类浏览 -->
  <rect x="990" y="90" width="220" height="130" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1100" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">[3]d 按分类浏览</text>
  <text x="1100" y="148" text-anchor="middle" font-size="11" fill="#475569">先列分类清单（含数量）</text>
  <text x="1100" y="168" text-anchor="middle" font-size="11" fill="#475569">输入编号查看该类技能</text>
  <text x="1100" y="188" text-anchor="middle" font-size="11" fill="#475569">快速定位目标技能</text>

  <!-- 中央：共享库 -->
  <rect x="470" y="280" width="300" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="620" y="316" text-anchor="middle" font-size="17" font-weight="700" fill="#1D4ED8">共享技能库</text>
  <text x="620" y="344" text-anchor="middle" font-size="11" fill="#64748B" font-family="Consolas, monospace">C:\Users\24664\skills\shared</text>
  <text x="620" y="372" text-anchor="middle" font-size="12" fill="#1E40AF">唯一数据源 · 所有 Agent 的『门』都指向这里</text>

  <!-- 扫描带 -->
  <rect x="240" y="470" width="760" height="100" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <text x="620" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">[5] 扫描各 Agent 已安装技能（scan-agents.ps1）</text>
  <text x="620" y="526" text-anchor="middle" font-size="11" fill="#475569">在 Agent 内手动安装的技能只落在该 Agent 目录，不会自动进共享库 —— 扫描可发现它们</text>
  <text x="620" y="548" text-anchor="middle" font-size="11" fill="#065F46">Agent 目录接入共享库后，其内手动安装的技能会直接落在共享库，天然共享</text>

  <!-- 四个状态标签 -->
  <rect x="60" y="620" width="270" height="100" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="195" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">✅ 已接入共享库</text>
  <text x="195" y="676" text-anchor="middle" font-size="11" fill="#475569">该目录是 Junction</text>
  <text x="195" y="696" text-anchor="middle" font-size="11" fill="#475569">技能全部来自共享库 · 无需处理</text>

  <rect x="355" y="620" width="270" height="100" rx="10" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="490" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">[已共享] / [冲突]</text>
  <text x="490" y="676" text-anchor="middle" font-size="11" fill="#475569">内容一致 = 重复安装，可删冗余</text>
  <text x="490" y="696" text-anchor="middle" font-size="11" fill="#B45309">同名不同内容 = 人工对比保留一份</text>

  <rect x="650" y="620" width="270" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="785" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">[独有]</text>
  <text x="785" y="676" text-anchor="middle" font-size="11" fill="#475569">共享库没有该技能</text>
  <text x="785" y="696" text-anchor="middle" font-size="11" fill="#1E40AF">建议迁移进共享库，让所有 Agent 共用</text>

  <rect x="945" y="620" width="270" height="100" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="1080" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#B91C1C">✗ 目录不存在</text>
  <text x="1080" y="676" text-anchor="middle" font-size="11" fill="#7F1D1D">Agent 未安装或路径已变</text>
  <text x="1080" y="696" text-anchor="middle" font-size="11" fill="#7F1D1D">检查 config\agents.json 中的路径</text>

  <!-- 箭头 -->
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <line x1="200" y1="220" x2="470" y2="310" marker-end="url(#arr)"/>
    <line x1="510" y1="220" x2="620" y2="280" marker-end="url(#arr)"/>
    <line x1="820" y1="220" x2="770" y2="280" marker-end="url(#arr)"/>
    <line x1="1100" y1="220" x2="770" y2="310" marker-end="url(#arr)"/>
    <line x1="620" y1="400" x2="620" y2="462" marker-end="url(#arr)"/>
  </g>
  <g stroke="#10B981" stroke-width="2" fill="none">
    <line x1="440" y1="570" x2="300" y2="612" marker-end="url(#arr)"/>
    <line x1="560" y1="570" x2="560" y2="612" marker-end="url(#arr)"/>
    <line x1="700" y1="570" x2="700" y2="612" marker-end="url(#arr)"/>
    <line x1="840" y1="570" x2="1020" y2="612" marker-end="url(#arr)"/>
  </g>
</svg>
