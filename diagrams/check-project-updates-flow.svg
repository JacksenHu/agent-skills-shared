<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1240" height="680" fill="url(#bg)"/>

  <!-- 标题 -->
  <rect x="340" y="30" width="560" height="56" rx="14" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="620" y="67" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">项目（工具）自身更新检测</text>

  <!-- ① 本地 VERSION -->
  <rect x="40" y="130" width="240" height="150" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#38BDF8">① 本地 VERSION</text>
  <text x="160" y="192" text-anchor="middle" font-size="12" fill="#94A3B8">项目根目录 VERSION 文件</text>
  <rect x="70" y="212" width="180" height="34" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="160" y="234" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#E2E8F0">1.0.0</text>

  <!-- 箭头 ①→② -->
  <path d="M 280 205 L 460 205" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ② 远程 VERSION -->
  <rect x="470" y="130" width="300" height="150" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#38BDF8">② 远程 VERSION</text>
  <text x="620" y="192" text-anchor="middle" font-size="12" fill="#94A3B8">GitHub 仓库 main 分支 VERSION</text>
  <rect x="490" y="212" width="260" height="34" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="620" y="234" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#E2E8F0">api.github.com / JacksenHu/agent-skills-shared</text>

  <!-- 箭头 ②→③ -->
  <path d="M 770 205 L 950 205" stroke="#475569" stroke-width="2.5"/>

  <!-- ③ 对比判定 -->
  <rect x="960" y="130" width="240" height="150" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1080" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#38BDF8">③ 对比判定</text>
  <text x="1080" y="192" text-anchor="middle" font-size="12" fill="#94A3B8">本地 vs 远程版本号</text>
  <text x="1080" y="222" text-anchor="middle" font-size="12" fill="#E2E8F0">相等 → [最新]</text>
  <text x="1080" y="244" text-anchor="middle" font-size="12" fill="#E2E8F0">本地旧 → [有更新]</text>
  <text x="1080" y="266" text-anchor="middle" font-size="12" fill="#E2E8F0">无本地 → [无基准]</text>

  <!-- 四状态框 -->
  <rect x="40" y="330" width="270" height="110" rx="10" fill="#052E16" stroke="#16A34A" stroke-width="1.5"/>
  <text x="175" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#4ADE80">[最新] 已是最新</text>
  <text x="175" y="384" text-anchor="middle" font-size="11" fill="#86EFAC">无需任何操作</text>
  <text x="175" y="406" text-anchor="middle" font-size="11" fill="#86EFAC">（退出码 0）</text>

  <rect x="340" y="330" width="270" height="110" rx="10" fill="#78350F" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="475" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#FBBF24">[有更新] 本地落后</text>
  <text x="475" y="384" text-anchor="middle" font-size="11" fill="#FDE68A">显示 本地 → 远程</text>
  <text x="475" y="406" text-anchor="middle" font-size="11" fill="#FDE68A">可一键升级（-Update）</text>

  <rect x="640" y="330" width="270" height="110" rx="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="775" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#60A5FA">[无基准] 本地无 VERSION</text>
  <text x="775" y="384" text-anchor="middle" font-size="11" fill="#93C5FD">旧版解压 / 首次使用</text>
  <text x="775" y="406" text-anchor="middle" font-size="11" fill="#93C5FD">-Update 同步一次建立基准</text>

  <rect x="945" y="280" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1080" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">[不可查] 远程读不到</text>
  <text x="1080" y="334" text-anchor="middle" font-size="11" fill="#64748B">仓库不存在 / 404 / 网络</text>
  <text x="1080" y="356" text-anchor="middle" font-size="11" fill="#64748B">匿名限速超限 → 配 Token 重试</text>

  <!-- ④ 升级流程 -->
  <rect x="40" y="470" width="1170" height="130" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="500" font-size="15" font-weight="700" fill="#38BDF8">④ -Update 升级流程（仅 [有更新] / [无基准] 时进入）</text>
  <text x="80" y="530" font-size="12" fill="#94A3B8">A. git clone --depth 1（已装 git） 或 下载 ZIP（codeload）</text>
  <text x="80" y="554" font-size="12" fill="#94A3B8">B. 逐个文件 SHA256 对比 → 列出差异清单</text>
  <text x="80" y="578" font-size="12" fill="#94A3B8">C. 二次确认后覆盖（config\agents.json 用户配置硬排除）</text>
  <text x="80" y="602" font-size="12" fill="#94A3B8">D. 本地 VERSION 同步为远程版本 → 新版本立即生效</text>

  <!-- 底部说明 -->
  <text x="620" y="652" text-anchor="middle" font-size="11" fill="#94A3B8">说明：仓库为公开仓库，匿名即可检测（GitHub API 匿名限速 60 次/小时）；设置 GITHUB_TOKEN 或 -Token 可提高配额，Token 无效时自动降级匿名。</text>
</svg>
