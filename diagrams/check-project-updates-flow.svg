<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <title>项目（工具）自身更新检测</title>
  <desc>check-project-updates.ps1：对比本地 VERSION 与远程 VERSION → 判定更新 → 一键升级（排除用户配置）</desc>
  <rect x="0" y="0" width="1240" height="760" fill="#F8FAFC"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <text x="620" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">项目（工具）自身更新检测（check-project-updates.ps1）</text>
  <text x="620" y="62" text-anchor="middle" font-size="13" fill="#64748B">向导主菜单 [6] → [b] · 检测本项目是否有新版本推送 · 与「技能版本更新」[6]a 是两个层面</text>

  <!-- 第一行：三个来源 -->
  <rect x="60" y="90" width="260" height="130" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="190" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">① 本地版本基准</text>
  <text x="190" y="146" text-anchor="middle" font-size="11" fill="#475569">读取项目根 VERSION 文件</text>
  <text x="190" y="166" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas, monospace">如 1.0.0</text>
  <text x="190" y="186" text-anchor="middle" font-size="11" fill="#64748B">首次使用（无 VERSION）</text>
  <text x="190" y="206" text-anchor="middle" font-size="11" fill="#F59E0B">→ [无基准]，-Update 同步一次</text>

  <rect x="370" y="90" width="260" height="130" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="500" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">② 远程版本</text>
  <text x="500" y="146" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas, monospace">GET /repos/o/r/contents/VERSION</text>
  <text x="500" y="166" text-anchor="middle" font-size="11" fill="#475569">读取仓库 main 分支的 VERSION</text>
  <text x="500" y="186" text-anchor="middle" font-size="11" fill="#F59E0B">私有仓库需 Token：</text>
  <text x="500" y="206" text-anchor="middle" font-size="11" fill="#B45309" font-family="Consolas, monospace">GITHUB_TOKEN 或 -Token</text>

  <rect x="680" y="90" width="260" height="130" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="810" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">③ 对比版本号</text>
  <text x="810" y="146" text-anchor="middle" font-size="11" fill="#475569">本地 == 远程 → [最新]</text>
  <text x="810" y="166" text-anchor="middle" font-size="11" fill="#B91C1C">本地 ≠ 远程 → [有更新]</text>
  <text x="810" y="186" text-anchor="middle" font-size="11" fill="#64748B">远程读不到</text>
  <text x="810" y="206" text-anchor="middle" font-size="11" fill="#92400E">→ [不可查]（私有/404/网络）</text>

  <!-- 升级动作 -->
  <rect x="990" y="90" width="220" height="130" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <text x="1100" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">④ -Update 一键升级</text>
  <text x="1100" y="146" text-anchor="middle" font-size="11" fill="#475569">git clone 拉取最新</text>
  <text x="1100" y="166" text-anchor="middle" font-size="11" fill="#475569">（无 git 则下载 ZIP）</text>
  <text x="1100" y="186" text-anchor="middle" font-size="11" fill="#B91C1C">自动排除用户配置</text>
  <text x="1100" y="206" text-anchor="middle" font-size="11" fill="#B45309" font-family="Consolas, monospace">config\agents.json</text>

  <!-- 箭头 -->
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <line x1="320" y1="155" x2="362" y2="155" marker-end="url(#arr)"/>
    <line x1="630" y1="155" x2="672" y2="155" marker-end="url(#arr)"/>
    <line x1="940" y1="155" x2="982" y2="155" marker-end="url(#arr)"/>
  </g>

  <!-- 四个状态框 -->
  <rect x="60" y="280" width="270" height="110" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="195" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">[最新] 本地 = 远程</text>
  <text x="195" y="334" text-anchor="middle" font-size="11" fill="#047857">本项目已是最新版本</text>
  <text x="195" y="356" text-anchor="middle" font-size="11" fill="#475569">无需任何操作</text>

  <rect x="355" y="280" width="270" height="110" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
  <text x="490" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">[有更新] 本地 ≠ 远程</text>
  <text x="490" y="334" text-anchor="middle" font-size="11" fill="#7F1D1D">作者推送了新版本</text>
  <text x="490" y="356" text-anchor="middle" font-size="11" fill="#475569">显示 本地 → 远程 版本号</text>

  <rect x="650" y="280" width="270" height="110" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="785" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">[无基准] 没有 VERSION</text>
  <text x="785" y="334" text-anchor="middle" font-size="11" fill="#B45309">旧版解压 / 未记录版本</text>
  <text x="785" y="356" text-anchor="middle" font-size="11" fill="#475569">运行 -Update 同步一次</text>

  <rect x="945" y="280" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1080" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">[不可查] 远程读不到</text>
  <text x="1080" y="334" text-anchor="middle" font-size="11" fill="#64748B">私有仓库未配 Token / 404 / 网络</text>
  <text x="1080" y="356" text-anchor="middle" font-size="11" fill="#64748B">配 Token 或换网络后重试</text>

  <!-- 升级流程条 -->
  <rect x="60" y="440" width="1120" height="180" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="120" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">-Update 升级流程</text>

  <!-- 升级子步骤 -->
  <rect x="90" y="492" width="240" height="100" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="210" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">A. 获取更新包</text>
  <text x="210" y="544" text-anchor="middle" font-size="11" fill="#475569">有 git → clone --depth 1</text>
  <text x="210" y="564" text-anchor="middle" font-size="11" fill="#475569">无 git → 下载 ZIP 解压</text>
  <text x="210" y="584" text-anchor="middle" font-size="11" fill="#B45309">失败 → 给出手动下载指引</text>

  <rect x="355" y="492" width="240" height="100" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="475" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">B. 比对文件差异</text>
  <text x="475" y="544" text-anchor="middle" font-size="11" fill="#475569">逐文件 SHA256 对比</text>
  <text x="475" y="564" text-anchor="middle" font-size="11" fill="#475569">列出需要更新的文件</text>
  <text x="475" y="584" text-anchor="middle" font-size="11" fill="#475569">内容一致的文件自动跳过</text>

  <rect x="620" y="492" width="240" height="100" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="740" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">C. 二次确认</text>
  <text x="740" y="544" text-anchor="middle" font-size="11" fill="#475569">展示差异清单</text>
  <text x="740" y="564" text-anchor="middle" font-size="11" fill="#B91C1C">config\agents.json 已排除</text>
  <text x="740" y="584" text-anchor="middle" font-size="11" fill="#475569">输入 Y 才覆盖</text>

  <rect x="885" y="492" width="265" height="100" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="1017" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">D. 完成</text>
  <text x="1017" y="544" text-anchor="middle" font-size="11" fill="#047857">本地 VERSION 同步到远程版本</text>
  <text x="1017" y="564" text-anchor="middle" font-size="11" fill="#475569">新版本立即生效</text>
  <text x="1017" y="584" text-anchor="middle" font-size="11" fill="#64748B">无需重启 Agent</text>

  <g stroke="#2563EB" stroke-width="2" fill="none">
    <line x1="330" y1="542" x2="347" y2="542" marker-end="url(#arr)"/>
    <line x1="595" y1="542" x2="612" y2="542" marker-end="url(#arr)"/>
    <line x1="860" y1="542" x2="877" y2="542" marker-end="url(#arr)"/>
  </g>

  <!-- 箭头 状态→升级 -->
  <g stroke="#10B981" stroke-width="2" fill="none">
    <line x1="490" y1="390" x2="620" y2="432" marker-end="url(#arrG)"/>
  </g>

  <text x="620" y="652" text-anchor="middle" font-size="11" fill="#94A3B8">注意：本项目仓库为私有，远程检测需 GitHub Token（只读 repo 权限即可）：GITHUB_TOKEN 环境变量或 -Token 参数。</text>
  <text x="620" y="674" text-anchor="middle" font-size="11" fill="#94A3B8">命令行：.\scripts\check-project-updates.ps1（检测）· -Update（升级）· 也可在向导 [6] → [b] 操作。</text>
  <text x="620" y="696" text-anchor="middle" font-size="11" fill="#94A3B8">git 克隆目录的备选升级方式：git pull（注意勿覆盖 config\agents.json）。</text>
</svg>
