<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <title>搭建流程</title>
  <desc>从配置到验证的完整搭建步骤</desc>
  <rect x="0" y="0" width="1100" height="880" fill="#F8FAFC"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">搭建流程（交互向导 或 手动步骤）</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748B">推荐：setup-wizard.ps1 全程选择即可；手动：setup.ps1（先 -WhatIf）→ verify.ps1 → 重启会话</text>

  <!-- 节点组件：矩形 -->
  <g font-size="13" fill="#FFFFFF">
    <rect x="290" y="86" width="520" height="48" rx="10" fill="#2563EB"/>
    <text x="550" y="116" text-anchor="middle" font-weight="700">① 准备：编辑 config\agents.json（共享库路径 + Agent 清单）</text>
  </g>

  <g font-size="13" fill="#1E293B">
    <rect x="290" y="152" width="520" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="550" y="182" text-anchor="middle">② 试运行：.\scripts\setup.ps1 -WhatIf（只预览，不执行）</text>
  </g>

  <!-- 菱形 1：NTFS -->
  <g>
    <polygon points="550,232 780,268 550,304 320,268" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="550" y="272" text-anchor="middle" font-size="13" fill="#92400E">共享库分区是 NTFS ？</text>
  </g>
  <rect x="36" y="244" width="240" height="48" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="156" y="266" text-anchor="middle" font-size="11" fill="#B91C1C">否 → 提示：</text>
  <text x="156" y="282" text-anchor="middle" font-size="11" fill="#B91C1C">改用 NTFS 分区后重试</text>
  <line x1="320" y1="268" x2="284" y2="268" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr)"/>

  <g font-size="13" fill="#1E293B">
    <rect x="290" y="326" width="520" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="550" y="356" text-anchor="middle">③ 创建共享库目录（不存在时）——数据唯一存放处</text>
  </g>

  <g font-size="13" fill="#1E293B">
    <rect x="290" y="392" width="520" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="550" y="422" text-anchor="middle">④ 循环：依次处理每个 Agent 根目录（下面四步）</text>
  </g>

  <!-- 菱形 2：存在？ -->
  <g>
    <polygon points="550,462 780,494 550,526 320,494" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="550" y="490" text-anchor="middle" font-size="13" fill="#92400E">目录已存在？</text>
    <text x="550" y="507" text-anchor="middle" font-size="11" fill="#B45309">（否 → 直接建联接，跳⑤）</text>
  </g>
  <rect x="830" y="470" width="240" height="48" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="950" y="492" text-anchor="middle" font-size="11" fill="#065F46">mklink /J 直接建联接</text>
  <text x="950" y="508" text-anchor="middle" font-size="11" fill="#065F46">→ 继续下一个 Agent</text>
  <line x1="780" y1="494" x2="822" y2="494" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 菱形 3：已是 Junction？ -->
  <g>
    <polygon points="550,548 780,580 550,612 320,580" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="550" y="584" text-anchor="middle" font-size="13" fill="#92400E">已是 Junction？</text>
  </g>
  <rect x="830" y="556" width="240" height="48" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="950" y="578" text-anchor="middle" font-size="11" fill="#065F46">校验目标=共享库</text>
  <text x="950" y="594" text-anchor="middle" font-size="11" fill="#065F46">✓ 跳过 ／ ✗ 报错</text>
  <line x1="780" y1="580" x2="822" y2="580" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 菱形 4：有内容？ -->
  <g>
    <polygon points="550,634 780,666 550,698 320,666" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="550" y="670" text-anchor="middle" font-size="13" fill="#92400E">目录内有内容？</text>
  </g>
  <rect x="830" y="642" width="240" height="48" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="950" y="664" text-anchor="middle" font-size="11" fill="#065F46">否 → 删空目录</text>
  <text x="950" y="680" text-anchor="middle" font-size="11" fill="#065F46">→ mklink /J 建联接</text>
  <line x1="780" y1="666" x2="822" y2="666" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 迁移 -->
  <g font-size="13" fill="#1E293B">
    <rect x="290" y="720" width="520" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="550" y="750" text-anchor="middle">⑤ 迁移内容进共享库（同名冲突：保留 + 报告）→ 删空目录 → 建联接</text>
  </g>

  <!-- 循环结束 -->
  <g font-size="13" fill="#FFFFFF">
    <rect x="290" y="786" width="520" height="48" rx="10" fill="#2563EB"/>
    <text x="550" y="816" text-anchor="middle" font-weight="700">⑥ 全部处理完 → 自动验证 verify.ps1 → 重启各 Agent 会话 ✅</text>
  </g>

  <!-- 主流程箭头 -->
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <line x1="550" y1="86" x2="550" y2="144" marker-end="url(#arr)"/>
    <line x1="550" y1="200" x2="550" y2="226" marker-end="url(#arr)"/>
    <line x1="550" y1="304" x2="550" y2="318" marker-end="url(#arr)"/>
    <line x1="550" y1="374" x2="550" y2="384" marker-end="url(#arr)"/>
    <line x1="550" y1="440" x2="550" y2="456" marker-end="url(#arr)"/>
    <line x1="550" y1="526" x2="550" y2="542" marker-end="url(#arr)"/>
    <line x1="550" y1="612" x2="550" y2="628" marker-end="url(#arr)"/>
    <line x1="550" y1="698" x2="550" y2="712" marker-end="url(#arr)"/>
    <line x1="550" y1="768" x2="550" y2="778" marker-end="url(#arr)"/>
  </g>

  <!-- 分支回到循环结束 -->
  <g stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <line x1="950" y1="518" x2="950" y2="810" />
    <line x1="950" y1="604" x2="950" y2="810" />
    <line x1="950" y1="690" x2="950" y2="810" />
    <line x1="818" y1="810" x2="950" y2="810" marker-end="url(#arr)"/>
  </g>
</svg>
