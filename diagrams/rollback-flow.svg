<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <title>回滚流程</title>
  <desc>异常检测、分类处理与彻底回退步骤</desc>
  <rect x="0" y="0" width="1100" height="780" fill="#F8FAFC"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">异常检测与回滚流程</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748B">核心保障：数据只存一份 → 拆联接永不丢数据，任何时刻都能回退</text>

  <g font-size="13" fill="#FFFFFF">
    <rect x="290" y="86" width="520" height="48" rx="10" fill="#2563EB"/>
    <text x="550" y="116" text-anchor="middle" font-weight="700">检测到异常：verify.ps1 报 [FAIL] / 技能被误删 / 某个 Agent 技能异常</text>
  </g>

  <!-- 问题分类 -->
  <g>
    <polygon points="550,162 780,194 550,226 320,194" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="550" y="198" text-anchor="middle" font-size="13" fill="#92400E">问题类型？</text>
  </g>

  <rect x="36" y="150" width="250" height="88" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="161" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">联接问题</text>
  <text x="161" y="204" text-anchor="middle" font-size="11" fill="#475569">[FAIL] / 路径失效 /</text>
  <text x="161" y="222" text-anchor="middle" font-size="11" fill="#475569">共享库被移动</text>

  <rect x="814" y="150" width="250" height="88" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="939" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">数据问题</text>
  <text x="939" y="204" text-anchor="middle" font-size="11" fill="#475569">技能被误删 / 误改 /</text>
  <text x="939" y="222" text-anchor="middle" font-size="11" fill="#475569">内容损坏</text>

  <!-- 修复 -->
  <g font-size="13" fill="#1E293B">
    <rect x="290" y="270" width="520" height="56" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="550" y="294" text-anchor="middle">修复动作（按类型）</text>
    <text x="550" y="314" text-anchor="middle" font-size="12" fill="#475569">联接问题 → 修正配置重跑 setup.ps1 ／ add-agent.ps1 重建 ｜ 数据问题 → 共享库 git 回退 ／ 重新安装技能</text>
  </g>

  <g font-size="13" fill="#FFFFFF">
    <rect x="290" y="348" width="520" height="48" rx="10" fill="#10B981"/>
    <text x="550" y="378" text-anchor="middle" font-weight="700">重启 Agent 会话 → verify.ps1 复核 → 恢复正常 ✅</text>
  </g>

  <!-- 是否彻底回退 -->
  <g>
    <polygon points="550,428 780,460 550,492 320,460" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="550" y="456" text-anchor="middle" font-size="13" fill="#92400E">已无法恢复 / 想彻底回退？</text>
    <text x="550" y="474" text-anchor="middle" font-size="11" fill="#B45309">（否 → 到此结束）</text>
  </g>
  <rect x="814" y="436" width="250" height="48" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="939" y="458" text-anchor="middle" font-size="11" fill="#065F46">否 → 已完成 ✅</text>
  <text x="939" y="474" text-anchor="middle" font-size="11" fill="#065F46">无需其他操作</text>

  <!-- 回退步骤 -->
  <g font-size="13" fill="#1E293B">
    <rect x="290" y="530" width="520" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="550" y="560" text-anchor="middle">逐个拆除联接：remove-agent.ps1（每个 Agent 跑一次）</text>
    <text x="550" y="578" text-anchor="middle" font-size="11" fill="#64748B">技能仍完整保留在共享库 —— 拆联接 ≠ 删数据</text>
  </g>

  <g font-size="13" fill="#1E293B">
    <rect x="290" y="596" width="520" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="550" y="626" text-anchor="middle">把技能从共享库复制回各 Agent 原目录（分发副本）</text>
  </g>

  <g font-size="13" fill="#1E293B">
    <rect x="290" y="662" width="520" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="550" y="692" text-anchor="middle">（可选）删除共享库目录 → 系统回到「各自独立」状态</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <line x1="550" y1="134" x2="550" y2="156" marker-end="url(#arr)"/>
    <line x1="320" y1="194" x2="294" y2="194" marker-end="url(#arr)"/>
    <line x1="780" y1="194" x2="806" y2="194" marker-end="url(#arr)"/>
    <line x1="550" y1="226" x2="550" y2="262" marker-end="url(#arr)"/>
    <line x1="550" y1="326" x2="550" y2="340" marker-end="url(#arr)"/>
    <line x1="550" y1="396" x2="550" y2="422" marker-end="url(#arr)"/>
    <line x1="780" y1="460" x2="806" y2="460" marker-end="url(#arr)"/>
    <line x1="550" y1="492" x2="550" y2="522" marker-end="url(#arr)"/>
    <line x1="550" y1="578" x2="550" y2="588" marker-end="url(#arr)"/>
    <line x1="550" y1="644" x2="550" y2="654" marker-end="url(#arr)"/>
  </g>
</svg>
