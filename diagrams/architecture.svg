<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <title>方案一 · 统一技能库 + 目录联接 架构图</title>
  <desc>共享技能库为唯一数据源，各 Agent 的技能根目录通过 NTFS Junction 指向它</desc>
  <rect x="0" y="0" width="1240" height="800" fill="#F8FAFC"/>

  <text x="620" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">方案一 · 统一技能库 + 目录联接（Junction）</text>
  <text x="620" y="64" text-anchor="middle" font-size="13" fill="#64748B">数据只存一份；每个 Agent 的技能根目录都是一道指向共享库的「门」</text>

  <!-- ============ 共享技能库 ============ -->
  <rect x="50" y="90" width="400" height="540" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <path d="M 50 120 Q 50 90 80 90 L 420 90 Q 450 90 450 120 L 450 134 L 50 134 Z" fill="#2563EB"/>
  <text x="250" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">共享技能库（唯一数据源）</text>
  <text x="250" y="162" text-anchor="middle" font-size="11" fill="#1E293B" font-family="Consolas, monospace">C:\Users\24664\skills\shared\</text>

  <g font-size="12">
    <rect x="70" y="184" width="360" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="88" y="211" fill="#1E293B">tdd/</text>
    <rect x="322" y="193" width="92" height="24" rx="5" fill="#DBEAFE"/><text x="368" y="210" text-anchor="middle" font-size="10" fill="#1D4ED8">SKILL.md</text>

    <rect x="70" y="234" width="360" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="88" y="261" fill="#1E293B">grill-me/</text>
    <rect x="322" y="243" width="92" height="24" rx="5" fill="#DBEAFE"/><text x="368" y="260" text-anchor="middle" font-size="10" fill="#1D4ED8">SKILL.md</text>

    <rect x="70" y="284" width="360" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="88" y="311" fill="#1E293B">code-review/</text>
    <rect x="322" y="293" width="92" height="24" rx="5" fill="#DBEAFE"/><text x="368" y="310" text-anchor="middle" font-size="10" fill="#1D4ED8">SKILL.md</text>

    <rect x="70" y="334" width="360" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="88" y="361" fill="#1E293B">multi-search-engine/</text>
    <rect x="322" y="343" width="92" height="24" rx="5" fill="#DBEAFE"/><text x="368" y="360" text-anchor="middle" font-size="10" fill="#1D4ED8">SKILL.md</text>

    <rect x="70" y="384" width="360" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="88" y="411" fill="#1E293B">diagnosing-bugs/</text>
    <rect x="322" y="393" width="92" height="24" rx="5" fill="#DBEAFE"/><text x="368" y="410" text-anchor="middle" font-size="10" fill="#1D4ED8">SKILL.md</text>

    <rect x="70" y="434" width="360" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="5 4"/>
    <text x="88" y="461" fill="#64748B">…更多技能（随时添加，全部 Agent 同步可见）</text>
  </g>
  <text x="250" y="520" text-anchor="middle" font-size="11" fill="#64748B">技能 = 目录 + SKILL.md（+ 可选资源文件）</text>

  <!-- ============ Junction 通道 ============ -->
  <line x1="487" y1="120" x2="487" y2="600" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="452" y="150" width="70" height="420" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="4 3"/>
  <text x="487" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309" transform="rotate(-90 487 372)">NTFS Junction 透明转发</text>

  <!-- ============ Agent 卡片 ============ -->
  <g>
    <!-- 卡片 1: Doubao -->
    <rect x="520" y="90" width="330" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="540" y="118" font-size="15" font-weight="700" fill="#0F172A">Doubao（豆包）</text>
    <text x="540" y="142" font-size="10" fill="#64748B" font-family="Consolas, monospace">C:\Users\24664\AppData\Local\Doubao\</text>
    <text x="540" y="158" font-size="10" fill="#64748B" font-family="Consolas, monospace">User Data\…\agent_mode\workspace\</text>
    <text x="540" y="174" font-size="10" fill="#64748B" font-family="Consolas, monospace">.user_skills</text>
    <rect x="540" y="194" width="150" height="28" rx="6" fill="#FEF3C7"/>
    <text x="615" y="213" text-anchor="middle" font-size="11" fill="#B45309">Junction → 共享库</text>

    <!-- 卡片 2: Claude Code -->
    <rect x="520" y="255" width="330" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="540" y="283" font-size="15" font-weight="700" fill="#0F172A">Claude Code</text>
    <text x="540" y="307" font-size="10" fill="#64748B" font-family="Consolas, monospace">C:\Users\24664\.claude\skills</text>
    <rect x="540" y="325" width="92" height="24" rx="5" fill="#F1F5F9"/>
    <text x="586" y="341" text-anchor="middle" font-size="10" fill="#475569">用户级技能根</text>
    <rect x="540" y="359" width="150" height="28" rx="6" fill="#FEF3C7"/>
    <text x="615" y="378" text-anchor="middle" font-size="11" fill="#B45309">Junction → 共享库</text>

    <!-- 卡片 3: Codex -->
    <rect x="520" y="420" width="330" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="540" y="448" font-size="15" font-weight="700" fill="#0F172A">Codex</text>
    <text x="540" y="472" font-size="10" fill="#64748B" font-family="Consolas, monospace">C:\Users\24664\.agents\skills</text>
    <rect x="540" y="490" width="92" height="24" rx="5" fill="#F1F5F9"/>
    <text x="586" y="506" text-anchor="middle" font-size="10" fill="#475569">用户级技能根</text>
    <rect x="540" y="524" width="150" height="28" rx="6" fill="#FEF3C7"/>
    <text x="615" y="543" text-anchor="middle" font-size="11" fill="#B45309">Junction → 共享库</text>

    <!-- 卡片 4: Cursor -->
    <rect x="880" y="172" width="330" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="900" y="200" font-size="15" font-weight="700" fill="#0F172A">Cursor</text>
    <text x="900" y="224" font-size="10" fill="#64748B" font-family="Consolas, monospace">C:\Users\24664\.cursor\skills</text>
    <rect x="900" y="242" width="92" height="24" rx="5" fill="#F1F5F9"/>
    <text x="946" y="258" text-anchor="middle" font-size="10" fill="#475569">用户级技能根</text>
    <rect x="900" y="276" width="150" height="28" rx="6" fill="#FEF3C7"/>
    <text x="975" y="295" text-anchor="middle" font-size="11" fill="#B45309">Junction → 共享库</text>

    <!-- 卡片 5: OpenClaw -->
    <rect x="880" y="337" width="330" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="900" y="365" font-size="15" font-weight="700" fill="#0F172A">OpenClaw</text>
    <text x="900" y="389" font-size="10" fill="#64748B" font-family="Consolas, monospace">C:\Users\24664\.openclaw\</text>
    <text x="900" y="405" font-size="10" fill="#64748B" font-family="Consolas, monospace">workspace\skills</text>
    <rect x="900" y="423" width="92" height="24" rx="5" fill="#F1F5F9"/>
    <text x="946" y="439" text-anchor="middle" font-size="10" fill="#475569">技能根目录</text>
    <rect x="900" y="457" width="150" height="28" rx="6" fill="#FEF3C7"/>
    <text x="975" y="476" text-anchor="middle" font-size="11" fill="#B45309">Junction → 共享库</text>

    <!-- 卡片 6: 更多 Agent -->
    <rect x="880" y="502" width="330" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="6 4"/>
    <text x="900" y="530" font-size="15" font-weight="700" fill="#64748B">更多 Agent…</text>
    <text x="900" y="554" font-size="10" fill="#64748B">一行命令接入：</text>
    <text x="900" y="572" font-size="10" fill="#64748B" font-family="Consolas, monospace">add-agent.ps1 -RootPath …</text>
    <rect x="900" y="596" width="190" height="28" rx="6" fill="#F1F5F9"/>
    <text x="995" y="615" text-anchor="middle" font-size="11" fill="#475569">mklink /J 即可加入</text>
  </g>

  <!-- ============ 箭头（共享库 → 各卡片） ============ -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <line x1="450" y1="165" x2="512" y2="165" marker-end="url(#arr)"/>
    <line x1="450" y1="330" x2="512" y2="330" marker-end="url(#arr)"/>
    <line x1="450" y1="495" x2="512" y2="495" marker-end="url(#arr)"/>
    <line x1="450" y1="247" x2="872" y2="247" marker-end="url(#arr)"/>
    <line x1="450" y1="412" x2="872" y2="412" marker-end="url(#arr)"/>
    <line x1="450" y1="577" x2="872" y2="577" marker-end="url(#arr)"/>
  </g>

  <!-- ============ 底部结论 ============ -->
  <rect x="50" y="668" width="1170" height="62" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="635" y="694" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">任何入口的读写都落在同一份数据上 —— 新增 / 更新 / 删除技能，所有 Agent 同时生效</text>
  <text x="635" y="716" text-anchor="middle" font-size="11" fill="#047857">反向亦然：在任意 Agent 里误删技能 = 全局误删（详见 docs/05 风险与回滚）</text>
</svg>
